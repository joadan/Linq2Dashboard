name: Create Release

# Run by hand from the Actions tab. Tests, packs both packages, pushes them to NuGet and tags the commit.
# The version is version.json's major.minor, the git height as patch, and version.json's prerelease tag if it
# has one: "0.1-beta" gives 0.1.<height>-beta, "1.0" gives 1.0.<height>. The GitHub release is marked
# prerelease exactly when the version carries a tag. Only master and release/v* branches are public-release
# branches in version.json; dispatching from any other ref stops before anything is pushed.
#
# Publishing uses NuGet Trusted Publishing: no long-lived API key. The job's OIDC token is exchanged for a
# one-hour NuGet key by NuGet/login, which nuget.org allows because a trusted publishing policy names this
# repository and this workflow file. The only secret is NUGET_USER, the nuget.org profile name.
on: workflow_dispatch

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Refuse to release from a branch that is not a public-release branch
        if: ${{ github.ref_name != 'master' && !startsWith(github.ref_name, 'release/') }}
        run: |
          echo "::error::Releases are cut from master or a release/v* branch, not from '${{ github.ref_name }}'."
          exit 1

      - name: Get version
        id: nbgv
        uses: dotnet/nbgv@v0.5.2

      - name: Test
        run: |
          dotnet test tests/Linq2Dashboard.Tests/Linq2Dashboard.Tests.csproj -c Release
          dotnet test tests/Linq2Dashboard.Blazor.Tests/Linq2Dashboard.Blazor.Tests.csproj -c Release

      - name: Pack libraries
        run: |
          dotnet pack src/Linq2Dashboard/Linq2Dashboard.csproj -c Release -o artifacts
          dotnet pack src/Linq2Dashboard.Blazor/Linq2Dashboard.Blazor.csproj -c Release -o artifacts

      - name: NuGet login (Trusted Publishing, OIDC to a one-hour API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.nbgv.outputs.SemVer2 }}
          name: Release ${{ steps.nbgv.outputs.SemVer2 }}
          prerelease: ${{ steps.nbgv.outputs.PrereleaseVersion != '' }}
          generate_release_notes: true
          files: artifacts/*.nupkg
