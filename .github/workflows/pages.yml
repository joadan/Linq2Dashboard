name: Docs site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the WebAssembly tools workload (ahead-of-time compilation)
        run: dotnet workload install wasm-tools

      - name: Publish the docs site
        run: dotnet publish docs/Linq2Dashboard.Docs -c Release -o publish -p:RunAOTCompilation=true

      - name: Prepare for GitHub Pages
        run: |
          # A project site lives under the repository name.
          sed -i 's|<base href="/" />|<base href="/Linq2Dashboard/" />|' publish/wwwroot/index.html
          # Deep links load the app rather than a Pages 404.
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          # Pages ignores folders starting with an underscore unless told not to.
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
